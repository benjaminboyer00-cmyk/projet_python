# Configuration des outils qualité (flake8 = PEP8, mypy = typage, pytest).

[flake8]
max-line-length = 79
exclude = .venv,.git,__pycache__,notebooks,.ipynb_checkpoints

[mypy]
python_version = 3.10
ignore_missing_imports = True
exclude = (\.venv|notebooks)

[tool:pytest]
testpaths = tests
pythonpath = . tests
