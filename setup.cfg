# Configuration des outils de vérification du code.

# flake8 vérifie le respect de la PEP 8 (79 caractères maximum par ligne).
[flake8]
max-line-length = 79
exclude = .venv,.git,__pycache__,notebooks,.ipynb_checkpoints

# mypy vérifie la cohérence des annotations de type.
[mypy]
python_version = 3.10
ignore_missing_imports = True
exclude = (\.venv|notebooks)

# pytest : où trouver les tests et les modules à importer.
[tool:pytest]
testpaths = tests
pythonpath = . tests
